name: Synchronize to forked repo
on:
  push:
    branches:
      - develop
jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Configure git author
        run: |
          git config user.name "miloupark"
          git config user.email "${{ secrets.EMAIL }}"

      - name: Add remote-url (token auth)
        run: |
          git remote add forked-repo "https://x-access-token:${{ secrets.ACCESS_TOKEN }}@github.com/miloupark/oz_externship_fe_04_team2.git"

      - name: Push changes to forked-repo
        run: |
          git push --force-with-lease forked-repo develop

      - name: Clean up
        if: always()
        run: |
          git remote remove forked-repo
